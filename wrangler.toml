# Cloudflare Pages project configuration.
#
# Keeping this in the repository rather than in dashboard settings means the
# build configuration is reviewed like everything else, and a fresh Pages
# project picks it up with no clicking.
#
# ONE THING MUST MATCH: `name` has to be the exact name of your Pages project.
# If you create the project as anything other than "lifebook", change this line
# or the build will stop and tell you the names disagree.

name = "lifebook"
compatibility_date = "2026-09-01"

# Lifebook is a static bundle, so this Worker serves assets and runs no code of
# its own. `_headers` in the assets directory is honoured, which is where the
# security headers and cache rules live.
[assets]
directory = "./dist"
# Hash routing means every URL a browser requests is "/", so there is nothing to
# rewrite. A 404 here is a genuinely missing file and should say so.
not_found_handling = "none"

# There are deliberately no bindings here. Lifebook has no Workers, no
# Functions, no D1 and no KV: it is a static bundle that talks to exactly one
# other origin, and only when you have configured accounts. Adding a binding
# would mean adding a server to a local-first app.
