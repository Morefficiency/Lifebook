<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0E14" />

    <title>Lifebook — write the life you want, then see where it collides</title>

    <!--
      The description a stranger reads before deciding whether to click, and the
      one a search engine quotes. It says "kept for you" rather than "never
      leaves your device": with accounts, a copy is synced, and the sign-up
      consent says so plainly. A meta tag that promised otherwise would be the
      first thing this product lied about.
    -->
    <meta
      name="description"
      content="Write the life you want, area by area. List what you are actually trying to do. Ten minutes later, see the map of where your own goals collide — and the one they all run through. No feed, no streaks, nothing to check daily."
    />

    <!-- Sharing. Without these, a link posted anywhere is a bare grey URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lifebook" />
    <meta property="og:title" content="Lifebook" />
    <meta
      property="og:description"
      content="Write the life you want. Then see where your own goals collide — and the one belief sitting underneath more of it than you think."
    />
    <meta property="og:image" content="%APP_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lifebook — twelve areas of a life arranged around a single centre." />
    <meta property="og:url" content="%APP_URL%/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lifebook" />
    <meta
      name="twitter:description"
      content="Write the life you want. Then see where your own goals collide — and the one belief sitting underneath more of it than you think."
    />
    <meta name="twitter:image" content="%APP_URL%/og.png" />

    <link rel="canonical" href="%APP_URL%/" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Inlined so the page makes no favicon request of its own. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0E14'/%3E%3Cline x1='9' y1='10' x2='23' y2='22' stroke='%23C43E3E' stroke-width='2.5'/%3E%3Cline x1='9' y1='22' x2='23' y2='10' stroke='%233E7C59' stroke-width='2.5'/%3E%3Ccircle cx='9' cy='10' r='3.5' fill='%237BA3C4'/%3E%3Ccircle cx='23' cy='22' r='3.5' fill='%237BA3C4'/%3E%3Ccircle cx='9' cy='22' r='3' fill='%237BA3C4'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%237BA3C4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Said in the markup rather than only in the app, because this is what a
      crawler and a text browser see, and because a blank dark rectangle is a
      bad answer to "is this thing broken".
    -->
    <noscript>
      <div style="max-width:34rem;margin:12vh auto;padding:0 1.5rem;color:#E8E4DC;font-family:Georgia,serif;line-height:1.6">
        <h1 style="font-size:2rem;font-weight:400">Lifebook</h1>
        <p style="margin-top:1rem;color:#A8B0BC">
          Lifebook runs entirely in your browser — that is how your writing stays
          on your own machine — so it needs JavaScript switched on. Nothing is
          loaded from anywhere else, and there are no trackers to block.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
